name: CI

# Quality gate for pull requests: run the typecheck + build before merge.
on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main as a backstop.
  push:
    branches: [main]

# A newer commit on the same PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # --no-audit skips npm's registry audit call, which is not a build gate
      # and has stalled installs for minutes when that service is degraded.
      - run: npm ci --no-audit --fund=false
      - run: npm run lint
      - run: npm test
      # `npm run build` is `tsc -b && vite build` — the typecheck AND the build.
      - run: npm run build